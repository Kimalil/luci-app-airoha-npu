name: Build OpenWrt APK for Airoha

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  get_version:
    name: Get version from Makefile
    runs-on: ubuntu-24.04
    outputs:
      pkg_version: ${{ steps.extract.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Extract Version
        id: extract
        run: |
          VER=$(grep -oP '^PKG_VERSION:=\K.*' Makefile | tr -d ' \r\n')
          REL=$(grep -oP '^PKG_RELEASE:=\K.*' Makefile | tr -d ' \r\n')
          
          if [ -z "$VER" ]; then
            echo "Error: PKG_VERSION not found in Makefile"
            exit 1
          fi
          
          if [ -n "$REL" ]; then
            FULL_VER="v${VER}-${REL}"
          else
            FULL_VER="v${VER}"
          fi
          
          echo "Found version: $FULL_VER"
          echo "VERSION=$FULL_VER" >> $GITHUB_OUTPUT

  build:
    needs: get_version
    name: Build for ${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subtarget: [an7581, an7583]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: package/luci-app-airoha-npu

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget jq curl zstd

      - name: Download Airoha SDK
        env:
          TARGET: airoha
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          
          SDK_FILE=$(curl -s "$BASE_URL/sha256sums" | grep -oE "openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(zst|xz)" | head -n1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "Error: not found SDK"
            exit 1
          fi
          
          echo "Download: $SDK_FILE"
          wget -q "$BASE_URL/$SDK_FILE"
          
          mkdir sdk
          tar -xf "$SDK_FILE" -C sdk --strip-components=1

      - name: Prepare build environment
        working-directory: sdk
        run: |
          mv ../package/luci-app-airoha-npu package/
          
          sed -i 's|../../luci.mk|$(TOPDIR)/feeds/luci/luci.mk|g' package/luci-app-airoha-npu/Makefile
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" > .config
          echo "CONFIG_LUCI_JSMIN=n" >> .config
          echo "CONFIG_LUCI_CSSTIDY=n" >> .config
          make defconfig

      - name: Compile package
        working-directory: sdk
        run: |
          make package/luci-app-airoha-npu/compile -j$(nproc) V=s

      - name: Extract and verify APK
        run: |
          mkdir -p output_apk
          find sdk/bin/packages/ -type f -name "luci-app-airoha-npu*.apk" -exec sh -c 'cp "$1" "output_apk/$(basename "${1%.*}")_${{ matrix.subtarget }}.apk"' _ {} \;
          ls -lh output_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-airoha-npu-${{ matrix.subtarget }}-apk
          path: output_apk/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [get_version, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_version.outputs.pkg_version }}
          name: Release ${{ needs.get_version.outputs.pkg_version }}
          files: release-artifacts/*.apk
          generate_release_notes: true
